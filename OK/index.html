<script>
(()=>{'use strict';
const sites=[
{id:'ximen-redhouse',name:'新起街市場',era:'1920年代',year:1920,lat:25.0420652,lng:121.5069348,radius:75,now:'今・西門紅樓',img:'images/ximen-redhouse.jpg',thumb:'images/thumbs/ximen-redhouse.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6506&ctNode=404&mp=3',story:'現在的西門紅樓，最初曾是一座市場。走近建築，看看百年前商業生活留下了什麼痕跡。'},
{id:'nishi-honganji',name:'西本願寺本堂',era:'1930年代',year:1930,lat:25.04006,lng:121.50690,radius:80,now:'今・西本願寺廣場／臺北市立文獻館',img:'images/nishi-honganji.jpg',thumb:'images/thumbs/nishi-honganji.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6617&ctNode=404&mp=3',story:'昔日的西本願寺本堂已不復存在。走到文獻館附近，試著想像當年寺院曾經佔據的街區空間。'},
{id:'new-world-cinema',name:'新世界大戲院',era:'1950年代',year:1950,lat:25.04176,lng:121.50717,radius:75,now:'今・漢中街116號一帶',img:'images/new-world-cinema.jpg',thumb:'images/thumbs/new-world-cinema.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6507&ctNode=404&mp=3',story:'看電影曾經是西門町最重要的娛樂之一。在今日街頭尋找那座老戲院的身影，想像散場時熱鬧的人潮。'},
{id:'longshan-temple',name:'艋舺龍山寺',era:'1950年代',year:1950,lat:25.03732,lng:121.49987,radius:90,now:'今・龍山寺前廣場',img:null,thumb:null,archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6624&ctNode=404&mp=3',story:'曾經的龍山寺前有人力車與街頭生活。今天的廣場仍是萬華重要的聚會場所，試著比較兩個時代的氣氛。'},
{id:'zhonghua-market',name:'中華商場',era:'1960年代',year:1960,lat:25.04408,lng:121.50603,radius:90,now:'今・中華路一段（GPS 位置待現勘）',img:'images/zhonghua-market.jpg',thumb:'images/thumbs/zhonghua-market.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=6494&ctNode=404&mp=3',story:'過去中華商場曾沿著中華路綿延排列，如今建築已消失。這是城市變遷最鮮明的例子之一。'},
{id:'zhongshan-hall',name:'中山堂',era:'1970年',year:1970,lat:25.04348,lng:121.50957,radius:85,now:'今・延平南路98號',img:'images/zhongshan-hall.jpg',thumb:'images/thumbs/zhongshan-hall.webp',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=4007&ctNode=404&mp=3',story:'中山堂見證臺北公共生活的變化。從 1970 年的照片，再看看今日同一棟建築。'},
{id:'today-department',name:'今日百貨',era:'1986年',year:1986,lat:25.04368,lng:121.50537,radius:80,now:'今・峨眉街52號一帶',img:'images/today-department.jpg',thumb:'images/thumbs/today-department.webp',video:'videos/today-department.mp4',archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=7230&ctNode=404&mp=3',story:'昔日今日百貨曾經是西門町購物記憶的一部分。走到現址，看看當年的街景與今天有何不同。'},
{id:'bopiliao',name:'桂林路剝皮寮',era:'1994年',year:1994,lat:25.03808,lng:121.50260,radius:85,now:'今・剝皮寮歷史街區',img:null,thumb:null,archive:'https://archive.tpml.edu.tw/TaipeiLib/wSite/ct?xItem=0&dataId=680&ctNode=404&mp=3',story:'1990年代的剝皮寮仍保有街屋與店家日常。今天保存下來的街景，讓人重新思考老街與生活的關係。'}
];
const $=id=>document.getElementById(id);let selected=null, user=null, watch=null, activePrompt=null, lastNotice=null;let done;try{done=new Set(JSON.parse(localStorage.getItem('cx_v11_done')||'[]'))}catch{done=new Set()}
const timeline=$('timeline');const years=[...new Set(sites.map(s=>s.year))];years.forEach(y=>{const b=document.createElement('button');b.className='epoch';b.innerHTML=`<i></i><b>${y}</b>`;b.title=`${y}年代`;b.onclick=()=>{const site=sites.find(s=>s.year===y);if(!site)return;const i=sites.indexOf(site);select(i);};timeline.append(b)});
function setEpoch(){[...timeline.children].forEach((b,i)=>b.classList.toggle('active',selected!==null&&years[i]===sites[selected].year));if(selected!==null){const ix=years.indexOf(sites[selected].year);timeline.children[ix].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}}
const map=L.map('map',{zoomControl:true,preferCanvas:true,zoomSnap:1,zoomAnimation:true,markerZoomAnimation:false}).setView([25.0417,121.5054],15);
const tile=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors',keepBuffer:4,updateWhenIdle:true});tile.addTo(map);
let gotTile=false;tile.on('tileload',()=>{gotTile=true;$('mapError').style.display='none'});setTimeout(()=>{if(!gotTile)$('mapError').style.display='block'},7000);
const layer=L.layerGroup().addTo(map);
function ico(s,i){const c=done.has(s.id)?' visited':'';const a=selected===i?' active':'';const img=s.thumb?`<img src="${s.thumb}" alt="">`:'▣';return L.divIcon({html:`<div class="photo-marker${c+a}${s.thumb?'':' fallback'}">${img}</div>`,className:'',iconSize:[34,34],iconAnchor:[17,34]})}

  sites.forEach((site,i)=>{
    const marker=L.marker([site.lat,site.lng],{icon:ico(site,i),title:site.name,keyboard:true,zIndexOffset:selected===i?1000:0});

renderMarkers();setTimeout(()=>map.invalidateSize(),150);
function refreshProgress(){$('progress').textContent=`尋回 ${done.size} / ${sites.length}`;renderMarkers()}
function openSheet(){$('sheet').classList.add('open');$('shade').classList.add('open')};function closeSheet(){$('sheet').classList.remove('open');$('shade').classList.remove('open')};$('closeSheet').onclick=closeSheet;$('shade').onclick=closeSheet;
function select(i){selected=i;const s=sites[i];$('sheetEra').textContent=`${s.era} · 歷史片段 ${String(i+1).padStart(2,'0')} / 08`;$('sheetTitle').textContent=s.name;$('sheetNow').textContent=s.now;$('sheetStory').textContent=s.story;$('archive').href=s.archive;$('photoBox').replaceChildren();if(s.img){const im=new Image();im.src=s.img;im.decoding='async';im.alt=s.name+'歷史照片';$('photoBox').append(im)}else{$('photoBox').innerHTML='<div class="no-photo">館藏照片待補</div>'}$('photoLabel').textContent=s.img?'臺北市立圖書館數位典藏':'館藏原圖待提供';$('playLink').style.display=(s.video&&done.has(s.id))?'inline':'none';$('checkin').textContent=done.has(s.id)?'✓ 已打卡':'◎ 到點打卡';$('checkin').disabled=done.has(s.id);$('sheetState').textContent=done.has(s.id)?'此處已完成尋影':user?`${Math.round(distance(user,s))} 公尺 · GPS 已啟用`:'按「到點打卡」可選擇啟用定位';setEpoch();renderMarkers();openSheet()}
function distance(a,b){const rad=x=>x*Math.PI/180, dlat=rad(a.lat-b.lat),dlng=rad(a.lng-b.lng),h=Math.sin(dlat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dlng/2)**2;return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}

function closePrompt(){$('dialog').classList.remove('open');activePrompt=null};$('dialogCancel').onclick=closePrompt;$('dialogConfirm').onclick=()=>{const fn=activePrompt;closePrompt();if(fn)fn()};
let userMarker=null,accuracyCircle=null;
function updateUser(pos){user={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};const ll=[user.lat,user.lng];if(!userMarker){userMarker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#377dda',fillOpacity:1}).addTo(map);accuracyCircle=L.circle(ll,{radius:user.accuracy,color:'#5598ea',weight:1,fillColor:'#79b1f4',fillOpacity:.12}).addTo(map)}else{userMarker.setLatLng(ll);accuracyCircle.setLatLng(ll).setRadius(user.accuracy)}if(selected!==null){const s=sites[selected];$('sheetState').textContent=`距離約 ${Math.round(distance(user,s))} 公尺 · GPS 定位精度約 ${Math.round(user.accuracy)} 公尺`;if(!done.has(s.id)&&distance(user,s)<=s.radius&&user.accuracy<100&&lastNotice!==s.id){lastNotice=s.id;promptModal('已到達！',`你已進入「${s.name}」的打卡範圍。要確認打卡嗎？`,'確認打卡','稍後',()=>saveCheckin(s))}}}
function startGPS(){if(!navigator.geolocation){promptModal('無法定位','目前瀏覽器不支援 GPS，仍可查看照片並開啟 Google Maps 步行導航。','知道了','關閉');return}if(watch!==null){if(user)map.panTo([user.lat,user.lng]);return}watch=navigator.geolocation.watchPosition(pos=>{$('locate').textContent='◎ 定位成功';updateUser(pos)},err=>{watch=null;$('locate').textContent='◎ 我的位置';const reason=err.code===1?'定位權限遭到拒絕。請到瀏覽器網站設定開啟位置權限。':err.code===2?'暫時無法取得位置，請確認手機定位服務。':'定位逾時，請稍後再試。';promptModal('GPS 尚未啟用',reason,'知道了','關閉')},{enableHighAccuracy:true,maximumAge:5000,timeout:16000})}
function askGPS(){promptModal('啟用 GPS 定位？','只在你同意後讀取手機位置，用來顯示所在位置與判斷是否抵達打卡地點。拒絕也能看歷史照片。','允許定位','暫不啟用',startGPS)}$('locate').onclick=()=>{if(user){map.panTo([user.lat,user.lng]);return}askGPS()};
function saveCheckin(s){done.add(s.id);try{localStorage.setItem('cx_v11_done',JSON.stringify([...done]))}catch{}refreshProgress();if(selected!==null&&sites[selected].id===s.id)select(selected);promptModal('尋影完成',`已記錄「${s.name}」。${s.video?'你現在可以在故事頁選擇「看動圖」。':''}`,'返回故事','關閉')}
$('checkin').onclick=()=>{if(selected===null)return;const s=sites[selected];if(done.has(s.id))return;if(!user){askGPS();return}const dist=distance(user,s);if(dist>s.radius){promptModal('尚未抵達',`目前距離約 ${Math.round(dist)} 公尺。可先使用步行導航前往。`,'知道了','關閉');return}if(user.accuracy>=100){promptModal('定位精度不足','目前 GPS 誤差較大，請到較開闊地點再試，避免誤判打卡。','知道了','關閉');return}promptModal('已到達！',`你已進入「${s.name}」的打卡範圍，是否確認打卡？`,'確認打卡','稍後',()=>saveCheckin(s))};
$('navigation').onclick=()=>{if(selected===null)return;const s=sites[selected];const url=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}&travelmode=walking`;window.open(url,'_blank','noopener')};
$('playLink').onclick=e=>{e.preventDefault();if(selected===null)return;const s=sites[selected];if(!s.video||!done.has(s.id))return;$('vid').src=s.video;$('videoOverlay').classList.add('open');$('vid').play().catch(()=>{})};$('closeVideo').onclick=()=>{$('vid').pause();$('videoOverlay').classList.remove('open')};
refreshProgress();
})();
</script></body></html>
